[package]
name = "role-manager"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true

[dependencies]

tokio = { version = "1", features = [ "rt-multi-thread", "signal" ] }

chrono = "0.4"
speedate = "0.17"
itertools = "0.14"

serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1" }
json5 = "1"
toml = "1"
csv = "1.2"

sea-query = { version = "0.32" }
sea-orm = { version = "1", default-features = false, features = [ "sqlx-mysql", "runtime-tokio-rustls", "debug-print", "macros", "with-chrono" ] }

reqwest = { version = "0.13", features = ["json", "form", "query"] }
tower = { version = "0.5", features = ["full"] }
urlencoding = "2"

serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "cache", "rustls_backend", "model", "unstable_discord_api"] }
poise = "0.6.1"

tracing = "0.1"
tracing-subscriber = "0.3"
